<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unity WebGL Player | Bus Shelter RIGA XL-Size</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 600px;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <canvas id="unity-canvas"></canvas>

    <!-- Adjust file path to match your M-Size build loader -->
    <script src="Build/riga-bus-stop-XL.loader.js"></script>

    <script>
      (function () {
        "use strict";

        const UNITY_TARGET_OBJECT = "4 Glass long";

        const METHOD_BY_TYPE = {
          RearDisplay: "RearDisplayFromJs",
          SideDisplay: "SideDisplayFromJs",
          SideGlass: "SideGlassFromJs",
          PosterFrame: "PosterFrameFromJs",
          StandingBench: "StandingBenchFromJs",
          Silluete: "SillueteFromJs"
        };

        const queuedMessages = [];
        let unityInstance;

        function sendToUnity(type, message) {
          const method = METHOD_BY_TYPE[type];
          if (!method || !unityInstance) return;

          try {
            unityInstance.SendMessage(UNITY_TARGET_OBJECT, method, String(message));
          } catch (error) {
            console.error("Could not send " + type + " to Unity:", error);
          }
        }

        window.addEventListener("message", function (event) {
          if (event.source !== window.parent || !event.data || !METHOD_BY_TYPE[event.data.type]) {
            return;
          }

          const message = { type: event.data.type, message: event.data.message };

          if (!unityInstance) {
            queuedMessages.push(message);
          } else {
            sendToUnity(message.type, message.message);
          }
        });

        createUnityInstance(document.querySelector("#unity-canvas"), {
          // Adjust file paths to match your M-Size build files
          dataUrl: "Build/riga-bus-stop-XL.data",
          frameworkUrl: "Build/riga-bus-stop-XL.framework.js",
          codeUrl: "Build/riga-bus-stop-XL.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Bus Shelter RIGA XL-Size",
          productVersion: "1.0"
        })
          .then(function (instance) {
            unityInstance = instance;
            window.unityInstance = instance;

            while (queuedMessages.length > 0) {
              const queued = queuedMessages.shift();
              sendToUnity(queued.type, queued.message);
            }

            window.parent.postMessage({ type: "UNITY_READY" }, "*");
          })
          .catch(function (error) {
            console.error("Unity failed to load:", error);
          });
      }());
    </script>
  </body>
</html>
